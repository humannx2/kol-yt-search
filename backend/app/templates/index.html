<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Creator Search</title>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>YouTube Creator Search</h1>
        <p>
          Find Indian (or unknown-country) creators appearing most often for any
          YouTube topic.
        </p>
      </header>

      <form id="search-form" class="search-form" autocomplete="off">
        <input
          id="search-input"
          type="text"
          name="q"
          placeholder="Search a topic..."
          aria-label="Search topic"
          required
        />
        <label class="control">
          <span>Sort</span>
          <select id="sort-select" aria-label="Sort by">
            <option value="relevance" selected>Relevance</option>
            <option value="subscribers">Subscribers</option>
            <option value="views">Views</option>
          </select>
        </label>
        <label class="control">
          <span>Channels</span>
          <select id="limit-select" aria-label="Number of channels">
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </label>
        <button id="search-button" type="submit">Search</button>
        <button id="export-button" type="button" disabled>Export CSV</button>
      </form>

      <section id="status" class="status" hidden></section>
      <section id="results" class="results" hidden></section>
    </main>
    <script src="/static/js/app.js"></script>
  </body>
</html>
